blueprint:
  name: KoMi Kojima SPB-ZGB-W Button (ZHA)
  description: Universal blueprint for KoMi Kojima SPB-ZGB-W button connected via ZHA. Supports single (toggle), double (on), and long (off) press actions with configurable debounce protection.
  domain: automation
  author: alex-r58
  source_url: https://raw.githubusercontent.com/blackfantom200/HAS/refs/heads/main/TS004F__TZ3000_wc3gjyp3.yaml
  input:
    button_device:
      name: Button Device
      description: Select the KoMi Kojima SPB-ZGB-W button device.
      selector:
        device:
          integration: zha
          manufacturer: "_TZ3000_wc3gjyp3"
          model: "TS004F"
    debounce_seconds:
      name: Debounce Delay (seconds)
      description: Minimum time between any button presses to prevent accidental double-triggering. Set to 0.1 to effectively disable.
      default: 0.3
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          unit_of_measurement: seconds
    action_single:
      name: Single Click Action
      description: Action to run on single click (command 'toggle').
      default: []
      selector:
        action: {}
    action_double:
      name: Double Click Action
      description: Action to run on double click (command 'on').
      default: []
      selector:
        action: {}
    action_long:
      name: Long Press Action
      description: Action to run on long press (command 'off').
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input button_device

condition:
  - condition: template
    value_template: >
      {% set last = this.attributes.last_triggered %}
      {% if last %}
        {{ (now().timestamp() - last.timestamp()) > 0.3 }}
      {% else %}
        true
      {% endif %}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'toggle' }}"
        sequence: !input action_single
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'on' }}"
        sequence: !input action_double
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'off' }}"
        sequence: !input action_long